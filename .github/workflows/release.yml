name: Portable release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne $env:TAG) { throw 'Version mismatch' }
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run portable
      - shell: powershell
        run: |
          $zip = Get-ChildItem release/Temp-Sanitize-Portable-*.zip
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath smoke
          & ./tests/installer-smoke.ps1 -PackageRoot (Resolve-Path smoke/Temp-Sanitize).Path
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:TAG" --verify-tag --generate-notes (Get-ChildItem release/*.zip).FullName release/SHA256SUMS.txt
